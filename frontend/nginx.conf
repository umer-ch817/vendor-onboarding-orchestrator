# nginx config for the Vendor Onboarding frontend.
#
# Two jobs: serve the built SPA with history-API fallback, and proxy /api to the
# backend so the browser sees a single origin. Proxying rather than calling the
# backend directly keeps the deployment free of CORS configuration and means the
# API is never exposed on a second public port.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy will keep serving the old
    # bundle until every client happens to hard-refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback. Any unknown path is a client-side route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend reverse proxy.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Document upload and extraction are the slow paths. The default 60s
        # would cut off a large PDF mid-extraction.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Multipart uploads must not be buffered to a temp file before the
        # backend sees them; extraction streams the body.
        client_max_body_size 25m;
        proxy_request_buffering off;
    }

    # nginx's own health endpoint, used by the compose healthcheck.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
